[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "easyuuv-nc"
version = "2.0.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["easyuuv_nc*"]

[tool.setuptools.package-data]
easyuuv_nc = ["data/embodiment/*.usd", "data/embodiment/*.yaml"]
